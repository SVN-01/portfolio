    <linearGradient id="grad-blue" gradientUnits="userSpaceOnUse" x1="100" y1="20" x2="100" y2="182">

    </linearGradient>

      <stop offset="1" stop-color="#1FBFA0"/>
    </linearGradient>

    <!-- Мягкая тень для цветных вариантов -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#07203F" flood-opacity="0.18"/>

    </g>

    <!-- Одноцветный контурный знак: цвет наследуется через currentColor -->

      <circle cx="100" cy="100" r="20" fill="currentColor" stroke="none"/>
    </g>
  </defs>
<g id="v-icon" data-viewbox="0 0 200 200">
    <use xlink:href="#mark-solid" href="#mark-solid" filter="url(#soft-shadow)"/>
  </g>
