<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="41.37 14.37 530.04 171.26" width="530" height="171">
<defs>
    <!-- Основной градиент знака: глубокий синий (низ-лево) → мятный (верх-право) -->
    <linearGradient id="grad-net" gradientUnits="userSpaceOnUse" x1="50" y1="162" x2="152" y2="42">
      <stop offset="0" stop-color="#1B3ECF"/>
      <stop offset="0.52" stop-color="#1F86E8"/>
      <stop offset="1" stop-color="#2FE3B6"/>
    </linearGradient>

    <!-- Градиент акцентного (центрального) узла -->
    <linearGradient id="grad-core" gradientUnits="userSpaceOnUse" x1="82" y1="120" x2="118" y2="80">
      <stop offset="0" stop-color="#1ECFA2"/>
      <stop offset="1" stop-color="#6FF3D4"/>
    </linearGradient>

    <!-- Мягкое мятное свечение вокруг активного узла -->
    <radialGradient id="grad-glow" gradientUnits="userSpaceOnUse" cx="100" cy="100" r="44">
      <stop offset="0.42" stop-color="#2FE3B6" stop-opacity="0.34"/>
      <stop offset="0.72" stop-color="#2FE3B6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2FE3B6" stop-opacity="0"/>
    </radialGradient>

    <!-- Геометрия сети: рёбра (левая стойка, диагональ, правая стойка) -->
    <path id="net-links" fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
          d="M58 50 V150 M58 50 L142 150 M142 50 V150"/>

    <!-- Геометрия сети: угловые узлы -->
    <g id="net-corners">
      <circle cx="58" cy="50" r="16"/>
      <circle cx="58" cy="150" r="16"/>
      <circle cx="142" cy="50" r="16"/>
      <circle cx="142" cy="150" r="16"/>
    </g>

    <!-- Центральный узел — точка синапса -->
    <circle id="net-core" cx="100" cy="100" r="22"/>

    <!-- Цветной знак -->
    <g id="mark-color">
      <circle cx="100" cy="100" r="44" fill="url(#grad-glow)"/>
      <use href="#net-links" stroke="url(#grad-net)"/>
      <g fill="url(#grad-net)"><use href="#net-corners"/></g>
      <use href="#net-core" fill="url(#grad-core)"/>
    </g>

    <!-- Одноцветный знак: только линии и силуэт -->
    <g id="mark-mono" fill="currentColor" stroke="none">
      <use href="#net-links" fill="none" stroke="currentColor"/>
      <use href="#net-corners"/>
      <use href="#net-core"/>
    </g>

    <!-- Название -->
    <g id="wordmark">
      <text x="0" y="0" text-anchor="middle" fill="currentColor"
            font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
            font-size="80" font-weight="600" letter-spacing="9">NEURA</text>
    </g>
  </defs>
<g id="v-horizontal" data-viewbox="0 0 600 200" color="#2F6BE8">
    <g transform="translate(19,0)">
      <use href="#mark-color"/>
      <use href="#wordmark" transform="translate(379,127)"/>
    </g>
  </g>
</svg>
