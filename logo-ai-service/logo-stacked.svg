<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="18.36 28.06 269.27 315.63" width="269" height="316">
<defs>
    <style>
      .wordmark{
        font-family:"Segoe UI","Inter","Roboto",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
        font-weight:700;
        fill:#0E2C57;
      }
    </style>

    <!-- Палитра: глубокий синий -->
    <linearGradient id="grad-blue" gradientUnits="userSpaceOnUse" x1="100" y1="20" x2="100" y2="182">
      <stop offset="0" stop-color="#2569B8"/>
      <stop offset="1" stop-color="#0B2750"/>
    </linearGradient>

    <!-- Палитра: мятный акцент -->
    <linearGradient id="grad-mint" gradientUnits="userSpaceOnUse" x1="100" y1="28" x2="100" y2="172">
      <stop offset="0" stop-color="#7DF2DA"/>
      <stop offset="1" stop-color="#1FBFA0"/>
    </linearGradient>

    <!-- Мягкая тень для цветных вариантов -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#07203F" flood-opacity="0.18"/>
    </filter>

    <!-- Связи знака: сплошная траектория N (для цветных вариантов) -->
    <path id="link-path" fill="none" stroke-linecap="round" stroke-linejoin="round"
          d="M46 158 V42 L154 158 V42"/>

    <!-- Связи знака: подрезанная траектория (для контурного варианта) -->
    <path id="link-path-trim" fill="none" stroke-linecap="round"
          d="M46 134 V66 M62.4 59.6 L137.6 140.4 M154 134 V66"/>

    <!-- Цветной знак -->
    <g id="mark-solid">
      <use xlink:href="#link-path" href="#link-path" stroke="url(#grad-blue)" stroke-width="14"/>
      <circle cx="46" cy="42" r="15" fill="url(#grad-blue)"/>
      <circle cx="46" cy="158" r="15" fill="url(#grad-blue)"/>
      <circle cx="154" cy="158" r="15" fill="url(#grad-blue)"/>
      <circle cx="154" cy="42" r="15" fill="url(#grad-mint)"/>
      <circle cx="100" cy="100" r="22" fill="url(#grad-mint)"/>
      <circle cx="100" cy="100" r="8.5" fill="#0E2C57"/>
    </g>

    <!-- Одноцветный контурный знак: цвет наследуется через currentColor -->
    <g id="mark-line" fill="none" stroke="currentColor" stroke-width="10">
      <use xlink:href="#link-path-trim" href="#link-path-trim"/>
      <circle cx="46" cy="42" r="11"/>
      <circle cx="46" cy="158" r="11"/>
      <circle cx="154" cy="158" r="11"/>
      <circle cx="154" cy="42" r="11"/>
      <circle cx="100" cy="100" r="20" fill="currentColor" stroke="none"/>
    </g>
  </defs>
<g id="v-stacked" data-viewbox="0 0 300 360">
    <g transform="translate(25 6) scale(1.25)">
      <use xlink:href="#mark-solid" href="#mark-solid" filter="url(#soft-shadow)"/>
    </g>
    <text class="wordmark" x="153" y="316" font-size="62" letter-spacing="7" text-anchor="middle">NEURA</text>
  </g>
</svg>
