<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" color="#3B2A22" role="img" aria-labelledby="icon-title">
  <title id="icon-title">Тёплый угол — знак: окно с тёплым светом и ручка чашки</title>

  <!-- ручка чашки -->
  <path id="handle" fill="none" stroke="#C25B3E" stroke-width="4.6" stroke-linecap="round"
        d="M42 30.5c8.5 0 8.5 10 0 10"/>

  <!-- арочная оконная рама -->
  <path id="frame" fill="#C25B3E" d="M13 45V30a15 15 0 0 1 30 0v15Z"/>

  <!-- тёплый свет в окне -->
  <path id="light" fill="#F7EDE0" d="M16.5 41.5V30a11.5 11.5 0 0 1 23 0v11.5Z"/>

  <!-- переплёт окна -->
  <path id="bars" fill="none" stroke="#3B2A22" stroke-width="2.4" stroke-linecap="round"
        d="M28 19v22.5M17 31h22"/>

  <!-- деревянный подоконник / блюдце -->
  <rect id="sill" x="9" y="46.6" width="44" height="3.6" rx="1.8" fill="currentColor"/>
</svg>
