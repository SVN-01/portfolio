<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Баннер — Первая тренировка бесплатно</title>
<style>
  :root{
    --bg:#06070b;
    --ink:#ffffff;
    --muted:#8a92a6;
    --hot:#ff2f5e;
    --hot-2:#ff7a3d;
    --lime:#d8ff3e;
    --loop:6s;
  }

  *{box-sizing:border-box}

  html,body{height:100%}

  body{
    margin:0;
    background:
      radial-gradient(900px 500px at 50% -10%, #131726 0%, transparent 70%),
      var(--bg);
    color:var(--ink);
    font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:28px 16px;
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Баннер 1200×400 ---------- */
  .banner{
    position:relative;
    width:100%;
    max-width:1200px;
    aspect-ratio:1200/400;
    container-type:inline-size;
    border-radius:20px;
    overflow:hidden;
    isolation:isolate;
    background:
      radial-gradient(70% 120% at 84% 46%, rgba(255,47,94,.30) 0%, transparent 62%),
      radial-gradient(60% 110% at 8% 96%, rgba(216,255,62,.16) 0%, transparent 60%),
      linear-gradient(120deg,#0b0d16 0%,#11131f 48%,#0a0c14 100%);
    box-shadow:0 30px 70px -30px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.07);
  }

  /* диагональные полосы-«энергия» */
  .banner::before{
    content:"";
    position:absolute;
    inset:-30% -60%;
    background:repeating-linear-gradient(115deg,
      rgba(255,255,255,.055) 0 2px,
      rgba(255,255,255,0) 2px 42px);
    animation:drift var(--loop) linear infinite;
    z-index:0;
  }
  @keyframes drift{
    from{transform:translate3d(0,0,0)}
    to{transform:translate3d(92.6px,-43.2px,0)} /* один шаг паттерна */
  }

  /* световой пробег по баннеру */
  .banner::after{
    content:"";
    position:absolute;
    top:-40%;
    bottom:-40%;
    width:38%;
    left:-45%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.10),transparent);
    transform:skewX(-14deg);
    animation:sweep var(--loop) cubic-bezier(.5,0,.2,1) infinite;
    z-index:3;
    pointer-events:none;
  }
  @keyframes sweep{
    0%,52%{left:-45%;opacity:0}
    58%{opacity:1}
    88%,100%{left:118%;opacity:0}
  }

  .inner{
    position:relative;
    z-index:2;
    height:100%;
    display:grid;
    grid-template-columns:1fr 30cqw;
    align-items:center;
    gap:2cqw;
    padding:5.4cqw 5cqw;
  }

  /* ---------- Текст ---------- */
  .copy{min-width:0}

  .line{
    display:block;
    overflow:hidden;
    padding-bottom:.06em;
  }

  .word{
    display:inline-block;
    font-size:6.1cqw;
    line-height:1.02;
    font-weight:800;
    letter-spacing:-.025em;
    text-transform:uppercase;
    opacity:0;
    transform:translateY(112%);
    animation:wordIn var(--loop) cubic-bezier(.16,.86,.24,1) infinite;
  }
  .word + .word{margin-left:.26em}

  .word.accent{
    background:linear-gradient(96deg,var(--lime) 0%,#8ef0a0 45%,var(--lime) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:none;
    filter:drop-shadow(0 6px 26px rgba(216,255,62,.22));
  }

  .w1{animation-delay:.10s}
  .w2{animation-delay:.22s}
  .w3{animation-delay:.38s}

  @keyframes wordIn{
    0%,2%{opacity:0;transform:translateY(112%)}
    12%{opacity:1;transform:translateY(0)}
    88%{opacity:1;transform:translateY(0)}
    96%,100%{opacity:0;transform:translateY(-38%)}
  }

  /* тонкая линия-акцент под заголовком */
  .rule{
    height:.28cqw;
    min-height:2px;
    margin:2.6cqw 0 3.1cqw;
    width:26cqw;
    border-radius:99px;
    background:linear-gradient(90deg,var(--hot),var(--hot-2) 55%,transparent);
    transform-origin:left center;
    transform:scaleX(0);
    opacity:0;
    animation:ruleIn var(--loop) cubic-bezier(.2,.8,.2,1) infinite;
  }
  @keyframes ruleIn{
    0%,8%{transform:scaleX(0);opacity:0}
    20%{transform:scaleX(1);opacity:1}
    88%{transform:scaleX(1);opacity:1}
    96%,100%{transform:scaleX(1);opacity:0}
  }

  /* ---------- Кнопка ---------- */
  .btn{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:.7em;
    padding:1.15em 2.1em;
    font-size:1.75cqw;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    text-decoration:none;
    color:#12060c;
    border-radius:99px;
    background:linear-gradient(120deg,var(--hot) 0%,var(--hot-2) 100%);
    box-shadow:0 12px 30px -12px rgba(255,47,94,.85), inset 0 1px 0 rgba(255,255,255,.35);
    overflow:hidden;
    opacity:0;
    transform:translateY(26px) scale(.92);
    animation:btnIn var(--loop) cubic-bezier(.2,1.25,.4,1) infinite;
    transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
    will-change:transform,opacity;
  }
  .btn span{position:relative;z-index:2}
  .btn svg{width:1.05em;height:1.05em;position:relative;z-index:2;flex:none}
  .btn::after{ /* блик по кнопке */
    content:"";
    position:absolute;
    top:-60%;bottom:-60%;
    width:45%;
    left:-60%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
    transform:skewX(-18deg);
    animation:btnShine var(--loop) ease-in-out infinite;
  }
  @keyframes btnShine{
    0%,42%{left:-60%}
    62%,100%{left:130%}
  }
  @keyframes btnIn{
    0%,20%{opacity:0;transform:translateY(26px) scale(.92)}
    30%{opacity:1;transform:translateY(0) scale(1)}
    88%{opacity:1;transform:translateY(0) scale(1)}
    96%,100%{opacity:0;transform:translateY(-14px) scale(.98)}
  }
  .btn:hover{transform:translateY(-2px) scale(1.03);filter:saturate(1.08);box-shadow:0 18px 38px -14px rgba(255,47,94,1), inset 0 1px 0 rgba(255,255,255,.4);animation-play-state:paused;opacity:1}
  .btn:active{transform:translateY(0) scale(.99)}
  .btn:focus-visible{outline:3px solid var(--lime);outline-offset:4px}

  /* ---------- Сердце и пульс ---------- */
  .art{
    width:100%;
    height:auto;
    overflow:visible;
    opacity:0;
    transform:scale(.62);
    transform-origin:center;
    animation:artIn var(--loop) cubic-bezier(.2,.9,.25,1) infinite;
    animation-delay:.18s;
  }
  @keyframes artIn{
    0%,4%{opacity:0;transform:scale(.62)}
    16%{opacity:1;transform:scale(1)}
    88%{opacity:1;transform:scale(1)}
    96%,100%{opacity:0;transform:scale(1.1)}
  }

  .heart{
    transform-box:fill-box;
    transform-origin:center;
    animation:beat 1.2s cubic-bezier(.3,0,.2,1) infinite;
    filter:drop-shadow(0 10px 26px rgba(255,47,94,.55));
  }
  @keyframes beat{
    0%{transform:scale(1)}
    9%{transform:scale(1.14)}
    19%{transform:scale(1.01)}
    28%{transform:scale(1.09)}
    45%,100%{transform:scale(1)}
  }

  .glow{
    transform-box:fill-box;
    transform-origin:center;
    animation:glowPulse 1.2s ease-out infinite;
  }
  @keyframes glowPulse{
    0%{opacity:.55;transform:scale(.94)}
    22%{opacity:.9;transform:scale(1.06)}
    100%{opacity:.5;transform:scale(.94)}
  }

  .ring{
    transform-box:fill-box;
    transform-origin:center;
    animation:ringOut 1.2s cubic-bezier(.15,.6,.3,1) infinite;
  }
  .ring2{animation-delay:.6s}
  @keyframes ringOut{
    0%{transform:scale(.62);opacity:.5}
    100%{transform:scale(1.55);opacity:0}
  }

  .ecg-run{
    stroke-dasharray:150 1120;
    stroke-dashoffset:150;
    animation:ecg 2s linear infinite;
  }
  @keyframes ecg{
    from{stroke-dashoffset:150}
    to{stroke-dashoffset:-1120}
  }

  /* ---------- Адаптив ---------- */
  @container (max-width: 700px){
    .inner{
      grid-template-columns:1fr;
      grid-template-rows:auto auto;
      justify-items:center;
      text-align:center;
      gap:3cqw;
      padding:7cqw 6cqw;
    }
    .art-wrap{order:-1;width:34cqw}
    .word{font-size:9.4cqw}
    .rule{width:40cqw;margin:4cqw auto 5cqw}
    .btn{font-size:3.6cqw}
  }

  @media (max-width:720px){
    .banner{aspect-ratio:5/6;border-radius:16px}
  }

  .caption{
    margin:0;
    color:var(--muted);
    font-size:13px;
    letter-spacing:.04em;
    text-align:center;
  }

  /* ---------- Уважение к prefers-reduced-motion ---------- */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation:none !important;
      transition:none !important;
    }
    .banner::after{display:none}
    .word{opacity:1;transform:none}
    .rule{opacity:1;transform:none}
    .btn{opacity:1;transform:none}
    .btn::after{display:none}
    .art{opacity:1;transform:none}
    .ecg-run{stroke-dasharray:none;stroke-dashoffset:0}
    .ring{opacity:.28}
    .ring2{opacity:.14}
  }
</style>
</head>
<body>

  <div class="banner" role="img" aria-label="Первая тренировка бесплатно — записаться">
    <div class="inner">

      <div class="copy">
        <span class="line">
          <span class="word w1">Первая</span><span class="word w2">тренировка</span>
        </span>
        <span class="line">
          <span class="word accent w3">бесплатно</span>
        </span>

        <div class="rule"></div>

        <a class="btn" href="#zapis">
          <span>Записаться</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M4 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>

      <div class="art-wrap">
        <svg class="art" viewBox="0 0 380 260" aria-hidden="true">
          <defs>
            <linearGradient id="gHeart" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"  stop-color="#ff4d6d"/>
              <stop offset="55%" stop-color="#ff2f5e"/>
              <stop offset="100%" stop-color="#ff7a3d"/>
            </linearGradient>
            <radialGradient id="gGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%"  stop-color="#ff2f5e" stop-opacity=".55"/>
              <stop offset="60%" stop-color="#ff2f5e" stop-opacity=".16"/>
              <stop offset="100%" stop-color="#ff2f5e" stop-opacity="0"/>
            </radialGradient>
            <clipPath id="clipHeart">
              <path d="M190 190C150 160 118 132 118 100C118 76 136 60 156 60C172 60 184 70 190 82C196 70 208 60 224 60C244 60 262 76 262 100C262 132 230 160 190 190Z"/>
            </clipPath>
          </defs>

          <!-- свечение -->
          <circle class="glow" cx="190" cy="122" r="118" fill="url(#gGlow)"/>

          <!-- расходящиеся кольца от удара -->
          <circle class="ring"  cx="190" cy="122" r="96" fill="none" stroke="#ff2f5e" stroke-width="2"/>
          <circle class="ring ring2" cx="190" cy="122" r="96" fill="none" stroke="#d8ff3e" stroke-width="1.5"/>

          <!-- сердце -->
          <g class="heart">
            <path d="M190 190C150 160 118 132 118 100C118 76 136 60 156 60C172 60 184 70 190 82C196 70 208 60 224 60C244 60 262 76 262 100C262 132 230 160 190 190Z"
                  fill="url(#gHeart)"/>
            <path d="M156 74C140 76 130 88 129 102"
                  fill="none" stroke="rgba(255,255,255,.55)" stroke-width="6" stroke-linecap="round"/>
            <g clip-path="url(#clipHeart)">
              <path d="M190 190C150 160 118 132 118 100C118 76 136 60 156 60C172 60 184 70 190 82"
                    fill="rgba(255,255,255,.06)"/>
            </g>
          </g>

          <!-- линия пульса -->
          <path d="M0 128H104L118 128L130 92L148 176L164 106L176 128H380"
                fill="none" stroke="rgba(216,255,62,.20)" stroke-width="4"
                stroke-linecap="round" stroke-linejoin="round" pathLength="1000"/>
          <path class="ecg-run" d="M0 128H104L118 128L130 92L148 176L164 106L176 128H380"
                fill="none" stroke="#d8ff3e" stroke-width="4.5"
                stroke-linecap="round" stroke-linejoin="round" pathLength="1000"
                style="filter:drop-shadow(0 0 8px rgba(216,255,62,.85))"/>
        </svg>
      </div>

    </div>
  </div>

  <p class="caption">Анимированный баннер 1200×400 · цикл 6 секунд</p>

</body>
</html>
