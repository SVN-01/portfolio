<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Файлы работы — Баннер — Первая тренировка бесплатно</title>
<style>
:root { --bg:#f4f6f8; --card:#fff; --fg:#16202e; --muted:#5c6b7f;
        --line:#e2e8f0; --accent:#2f6bff; }
* { box-sizing:border-box; }
body { margin:0; padding:48px 24px 72px; background:var(--bg); color:var(--fg);
       font:16px/1.55 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
.wrap { width:min(1180px,100%); margin-inline:auto; }
h1 { font-size:clamp(26px,4vw,38px); margin:0 0 8px; letter-spacing:-.02em; }
.lead { color:var(--muted); margin:0 0 36px; max-width:60ch; }
.grid { display:grid; gap:22px;
        grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); }
.card { background:var(--card); border:1px solid var(--line); border-radius:16px;
        overflow:hidden; display:flex; flex-direction:column;
        transition:transform .15s ease, box-shadow .15s ease; }
.card:hover { transform:translateY(-3px);
              box-shadow:0 12px 32px rgba(20,30,50,.10); }
.shot { height:220px; display:flex; align-items:center; justify-content:center;
        background:#fafbfc; border-bottom:1px solid var(--line); padding:16px; }
.shot img { max-width:100%; max-height:100%; object-fit:contain; }
.shot.empty { color:var(--muted); font-size:14px; text-align:center; }
.body { padding:18px 20px 20px; display:flex; flex-direction:column; flex:1; }
.kind { font-size:12px; text-transform:uppercase; letter-spacing:.08em;
        color:var(--accent); font-weight:700; margin-bottom:6px; }
h2 { font-size:18px; margin:0 0 8px; }
.brief { color:var(--muted); font-size:14px; margin:0 0 14px; flex:1; }
.src { color:var(--muted); font-size:12px; margin:0 0 14px; }
.links { display:flex; gap:10px; flex-wrap:wrap; }
a.btn { text-decoration:none; font-size:14px; font-weight:600; padding:9px 16px;
        border-radius:9px; background:var(--accent); color:#fff; }
a.btn.ghost { background:transparent; color:var(--accent);
              border:1px solid var(--accent); }
footer { margin-top:44px; color:var(--muted); font-size:14px; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#11151b; --card:#181e26; --fg:#eef2f7; --muted:#93a1b3;
          --line:#252d38; }
  .shot { background:#141a21; }
}

.files { list-style:none; padding:0; margin:0 0 8px;
         border:1px solid var(--line); border-radius:14px; overflow:hidden;
         background:var(--card); }
.files li { display:flex; justify-content:space-between; align-items:center;
            gap:16px; padding:14px 18px; border-bottom:1px solid var(--line); }
.files li:last-child { border-bottom:0; }
.files a { color:var(--accent); text-decoration:none; font-weight:600;
           word-break:break-all; }
.files a:hover { text-decoration:underline; }
.files span { color:var(--muted); font-size:14px; white-space:nowrap; }
footer a { color:var(--muted); text-decoration:none; }
</style></head><body><div class="wrap">
<h1>Баннер — Первая тренировка бесплатно</h1>
